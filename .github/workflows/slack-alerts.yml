name: Slack alerts

# Posts to #vercel-alerts (via SLACK_WEBHOOK_URL) whenever a PR is opened
# or a new branch is created. Every message includes the GitHub link.

on:
  pull_request:
    types: [opened, reopened]
  create:

permissions:
  contents: read

jobs:
  notify-pull-request:
    name: Notify Slack — pull request
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Post PR alert
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "New pull request in ${{ github.repository }}"
            blocks:
              - type: header
                text:
                  type: plain_text
                  text: "New pull request opened"
              - type: section
                text:
                  type: mrkdwn
                  text: "*<${{ github.event.pull_request.html_url }}|${{ github.event.pull_request.title }}>*\n#${{ github.event.pull_request.number }} by `${{ github.event.pull_request.user.login }}` → `${{ github.event.pull_request.base.ref }}`\n`${{ github.event.pull_request.head.ref }}`"
              - type: actions
                elements:
                  - type: button
                    text:
                      type: plain_text
                      text: Open on GitHub
                    url: "${{ github.event.pull_request.html_url }}"

  notify-new-branch:
    name: Notify Slack — new branch
    if: github.event_name == 'create' && github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - name: Post branch alert
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "New branch in ${{ github.repository }}: ${{ github.event.ref }}"
            blocks:
              - type: header
                text:
                  type: plain_text
                  text: "New branch created"
              - type: section
                text:
                  type: mrkdwn
                  text: "*`${{ github.event.ref }}`* in `${{ github.repository }}`\nby `${{ github.actor }}`"
              - type: actions
                elements:
                  - type: button
                    text:
                      type: plain_text
                      text: Open on GitHub
                    url: "https://github.com/${{ github.repository }}/tree/${{ github.event.ref }}"
